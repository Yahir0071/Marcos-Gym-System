spring.application.name=Grupo04_MW_Gym

# =======================================================
# Conexión a Base de Datos (Soporta Variables de Entorno y Pooler IPv4)
# =======================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.eicpxnsgdladsgwrhffh}
spring.datasource.password=${DB_PASSWORD:234214234324322342}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Desactivar cache de Thymeleaf en desarrollo
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Codificación UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =======================================================
# Configuración JWT (Semana 15 Sesión 30)
# =======================================================
app.jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaEnergyGymUTPSemana15TokenFirmado2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

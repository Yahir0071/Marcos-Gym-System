<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/fragments :: layout(~{::title}, 'socios', ~{::main})}">
<head><title>Gestión de Socios - Energy Gym</title></head>
<body>
<main class="admin-page">
    <div class="page-header">
        <div>
            <small class="subtitle">GESTIÓN DE USUARIOS DEL GIMNASIO</small>
            <h1>SOCIOS</h1>
            <p>ADMINISTRA TUS SOCIOS, REVISA SU ESTADO Y MEMBRESÍAS</p>
        </div>
        <div>
            <button type="button" class="btn-primary" data-bs-toggle="modal" data-bs-target="#modalRegistrarSocio">+ REGISTRAR SOCIO</button>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show bg-dark text-success border border-success mb-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show bg-dark text-danger border border-danger mb-4" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group filter-large">
            <label>BUSCAR SOCIO</label>
            <input type="text" class="table-search-input" placeholder="Buscar por nombre, documento o teléfono...">
        </div>
        <div class="filter-group">
            <label>ESTADO</label>
            <select class="table-filter-select" data-filter-col="5">
                <option value="">TODOS LOS ESTADOS</option>
                <option value="ACTIVO">ACTIVO</option>
                <option value="INACTIVO">INACTIVO</option>
            </select>
        </div>
        <div class="filter-group">
            <label>USUARIO / EMAIL</label>
            <select class="table-filter-select" data-filter-col="4">
                <option value="">TODOS</option>
                <option value="@energygym.pe">CON CORREO INSTITUCIONAL</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table class="custom-table filterable-table" id="tablaSocios">
            <thead>
            <tr>
                <th>N°</th>
                <th>NOMBRE</th>
                <th>DOCUMENTO</th>
                <th>TELÉFONO</th>
                <th>USUARIO</th>
                <th>ESTADO</th>
                <th>ACCIÓN</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="socio : ${socios}">
                <td class="code-cell" th:text="${#numbers.formatInteger(socio.id, 2)}">01</td>
                <td class="fw-bold" th:text="${socio.nombres + ' ' + socio.apellidos}">Carlos Mendoza</td>
                <td th:text="${socio.dni}">72563123</td>
                <td th:text="${socio.telefono != null and !#strings.isEmpty(socio.telefono) ? socio.telefono : '—'}">987 654 321</td>
                <td class="text-xs text-muted" th:text="${socio.usuario != null ? socio.usuario.username : 'Sin usuario'}">user@energygym.pe</td>
                <td>
                    <span th:class="${socio.usuario != null and socio.usuario.activo ? '' : 'status-inactive'}"
                          th:text="${socio.usuario != null and socio.usuario.activo ? 'ACTIVO' : 'INACTIVO'}">ACTIVO</span>
                </td>
                <td><a href="#" class="btn-edit-row">VER / EDITAR</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(socios)}">
                <td colspan="7" class="text-center text-muted py-4">No hay socios registrados en el gimnasio.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Registrar Socio -->
    <div class="modal fade" id="modalRegistrarSocio" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content gym-modal">
                <div class="modal-header">
                    <h5 class="modal-title font-anton text-primary tracking-wide">REGISTRAR NUEVO SOCIO</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/socios/guardar}" method="post">
                    <div class="modal-body p-4">
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">DNI</label>
                                <input type="text" name="dni" class="form-control" maxlength="8" pattern="\d{8}" placeholder="8 dígitos" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">TELÉFONO</label>
                                <input type="text" name="telefono" class="form-control" maxlength="9" placeholder="9 dígitos">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">NOMBRES</label>
                            <input type="text" name="nombres" class="form-control" placeholder="Ej. Juan Carlos" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">APELLIDOS</label>
                            <input type="text" name="apellidos" class="form-control" placeholder="Ej. Pérez Gómez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CORREO ELECTRÓNICO (USUARIO)</label>
                            <input type="email" name="email" class="form-control" placeholder="socio@energygym.pe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CONTRASEÑA TEMPORAL</label>
                            <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline" data-bs-dismiss="modal">CANCELAR</button>
                        <button type="submit" class="btn btn-primary">REGISTRAR SOCIO</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/fragments :: layout(~{::title}, 'promociones', ~{::main})}">
<head><title>Promociones - Energy Gym</title></head>
<body>
<main class="admin-page">
    <div class="page-header">
        <div>
            <small class="subtitle">CREA Y GESTIONA TUS PROMOCIONES</small>
            <h1>PROMOCIONES</h1>
            <p>OFERTAS Y CAMPAÑAS DISPONIBLES PARA LOS SOCIOS</p>
        </div>
        <div>
            <button type="button" class="btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaPromocion">+ NUEVA PROMOCIÓN</button>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show bg-dark text-success border border-success mb-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show bg-dark text-danger border border-danger mb-4" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group filter-large">
            <label>BUSCAR PROMOCIÓN</label>
            <input type="text" class="table-search-input" placeholder="Buscar por título o descripción...">
        </div>
        <div class="filter-group">
            <label>ESTADO</label>
            <select class="table-filter-select" data-filter-col="4">
                <option value="">TODOS LOS ESTADOS</option>
                <option value="PUBLICADA">PUBLICADA</option>
                <option value="PAUSADA">PAUSADA / INACTIVA</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table class="custom-table filterable-table" id="tablaPromociones">
            <thead>
            <tr>
                <th>TÍTULO</th>
                <th>DESCUENTO</th>
                <th>DESCRIPCIÓN</th>
                <th>VIGENCIA</th>
                <th>ESTADO</th>
                <th>ACCIÓN</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="promo : ${promociones}">
                <td class="fw-bold text-primary" th:text="${promo.titulo}">2×1 EN PLAN PLUS</td>
                <td class="fw-bold" th:text="${promo.porcentajeDescuento + '% DSCTO'}">20% DSCTO</td>
                <td class="text-xs" th:text="${promo.descripcion != null ? promo.descripcion : 'Sin descripción adicional'}">Entrena con un amigo</td>
                <td th:text="${(promo.fechaInicio != null ? #temporals.format(promo.fechaInicio, 'dd MMM') : 'Inmediato') + ' – ' + (promo.fechaFin != null ? #temporals.format(promo.fechaFin, 'dd MMM yyyy') : 'Indefinido')}">
                    01 Ene – 31 Ene 2025
                </td>
                <td>
                    <span th:class="${promo.activa ? '' : 'status-inactive'}"
                          th:text="${promo.activa ? 'PUBLICADA' : 'PAUSADA'}">PUBLICADA</span>
                </td>
                <td>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn-edit-row btn-edit-promocion"
                                th:data-id="${promo.id}"
                                th:data-titulo="${promo.titulo}"
                                th:data-descuento="${promo.porcentajeDescuento}"
                                th:data-inicio="${promo.fechaInicio}"
                                th:data-fin="${promo.fechaFin}"
                                th:data-descripcion="${promo.descripcion}"
                                th:data-activa="${promo.activa}"
                                data-bs-toggle="modal" data-bs-target="#modalNuevaPromocion">EDITAR</button>
                        <form th:action="@{/admin/promociones/cambiar-estado}" method="post" class="d-inline">
                            <input type="hidden" name="id" th:value="${promo.id}">
                            <input type="hidden" name="activa" th:value="${!promo.activa}">
                            <button type="submit" class="btn-outline py-0 px-2 text-xs"
                                    th:text="${promo.activa ? 'PAUSAR' : 'PUBLICAR'}">PAUSAR</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(promociones)}">
                <td colspan="6" class="text-center text-muted py-4">No hay promociones configuradas en la plataforma.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Nueva / Editar Promoción -->
    <div class="modal fade" id="modalNuevaPromocion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content gym-modal">
                <div class="modal-header">
                    <h5 class="modal-title font-anton text-primary tracking-wide" id="modalPromoTitle">GESTIONAR PROMOCIÓN</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/promociones/guardar}" method="post" id="formPromocion">
                    <input type="hidden" id="promoId" name="id">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label">TÍTULO DE LA PROMOCIÓN</label>
                            <input type="text" id="promoTitulo" name="titulo" class="form-control" placeholder="Ej. 25% OFF PLAN TRIMESTRAL" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">PORCENTAJE DE DESCUENTO (%)</label>
                            <input type="number" id="promoDescuento" name="porcentajeDescuento" step="0.5" min="1" max="100" class="form-control" placeholder="Ej. 25" required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">FECHA INICIO</label>
                                <input type="date" id="promoInicio" name="fechaInicio" class="form-control"
                                       th:value="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}">
                            </div>
                            <div class="col-6">
                                <label class="form-label">FECHA FIN</label>
                                <input type="date" id="promoFin" name="fechaFin" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">DESCRIPCIÓN / CONDICIONES</label>
                            <textarea id="promoDescripcion" name="descripcion" class="form-control" rows="3" placeholder="Aplica para nuevos socios, cupo limitado, etc..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ESTADO</label>
                            <select id="promoActiva" name="activa" class="form-select">
                                <option value="true">PUBLICADA (Visible para los socios)</option>
                                <option value="false">PAUSADA (Borrador u oculta)</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline" data-bs-dismiss="modal">CANCELAR</button>
                        <button type="submit" class="btn btn-primary">GUARDAR PROMOCIÓN</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Carrito - Energy Gym</title></head>
<body>
<section class="client-wrapper">
    <div th:replace="~{fragments/cliente-sidebar :: sidebar('productos')}"></div>
    <div class="client-main">
        <div th:replace="~{fragments/cliente-topbar :: topbar}"></div>
        <div class="client-content">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
                <h1 class="page-title font-anton m-0">Tu carrito</h1>
                <span class="text-primary font-anton" id="cartHeaderCounter" aria-live="polite">0 unidades</span>
            </div>
            <p class="text-muted">Revisa los productos que deseas recoger en recepción.</p>
            <div class="card p-4" id="cartEmpty">
                <h2 class="font-anton fs-5 text-light">Tu carrito está vacío</h2>
                <div><a th:href="@{/cliente/productos}" class="btn btn-primary">Ver productos</a></div>
            </div>
            <div class="card p-0 border-secondary" id="cartItemsContainer"></div>
            <div class="card p-4 mt-3" id="cartActions" hidden>
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <span>Total estimado</span>
                    <strong id="cartSummaryTotal" class="font-anton text-primary fs-4">S/ 0.00</strong>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/cliente/pago-en-linea}" class="btn btn-primary">Ir al pago simulado</a>
                    <a th:href="@{/cliente/productos}" class="btn btn-outline">Seguir viendo productos</a>
                    <button type="button" class="btn btn-link text-muted" id="btnClearCart">Vaciar carrito</button>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>

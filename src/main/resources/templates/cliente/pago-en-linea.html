<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Pago simulado - Energy Gym</title></head>
<body>
<section class="client-wrapper">
    <div th:replace="~{fragments/cliente-sidebar :: sidebar(${planCheckout != null ? 'membresia' : (reservaCheckout != null ? 'reservas' : 'productos')})}"></div>
    <div class="client-main">
        <div th:replace="~{fragments/cliente-topbar :: topbar}"></div>
        <div class="client-content">
            <div th:if="${reservaCheckout != null}" id="reservationCheckout" hidden
                 th:attr="data-reservation-id=${reservaCheckout.id},data-product-id=${reservaCheckout.producto.id},
                          data-name=${reservaCheckout.producto.nombre},data-img=${reservaCheckout.producto.imagenUrl},
                          data-category=${reservaCheckout.producto.categoria},data-price=${reservaCheckout.producto.precio},
                          data-qty=${reservaCheckout.cantidad}"></div>
            <div th:if="${planCheckout != null}" id="planCheckout" hidden
                 th:attr="data-plan-id=${planCheckout.id},data-periodo=${periodoCheckout.name()},
                          data-name=${planCheckout.nombre + ' · ' + periodoCheckout.etiqueta},data-price=${totalPlanCheckout}"></div>
            <a th:if="${planCheckout != null}" th:href="@{/planes}" class="btn-link-white font-anton text-xs">Volver a planes</a>
            <a th:if="${reservaCheckout != null}" th:href="@{/cliente/mis-reservas}" class="btn-link-white font-anton text-xs">Volver a mis reservas</a>
            <a th:if="${planCheckout == null and reservaCheckout == null}" th:href="@{/cliente/carrito}" class="btn-link-white font-anton text-xs">Volver al carrito</a>
            <h1 class="page-title font-anton mt-3"
                th:text="${planCheckout != null ? 'Renovación de membresía' : (reservaCheckout != null ? 'Pago de reserva' : 'Pago de productos')}">Pago de productos</h1>
            <div class="grid-2-col">
                <div class="card border-secondary p-4 align-self-start">
                    <h2 class="font-anton fs-5 text-primary">Tarjeta de prueba</h2>
                    <p class="text-muted text-sm">Esta tarjeta ficticia se usa para todos los escenarios.</p>
                    <div class="rounded border border-secondary bg-elevated p-3">
                        <div class="font-anton text-light tracking-wide"><i class="fa-regular fa-credit-card me-2" aria-hidden="true"></i> ENERGY GYM · PRUEBA</div>
                        <div class="text-muted mt-2">•••• •••• •••• 4242</div>
                    </div>
                </div>
                <div class="card border-secondary p-4">
                    <h2 class="font-anton fs-5 text-light">Resumen</h2>
                    <div class="mt-2" id="checkoutItemsList"></div>
                    <div id="checkoutTotalRow" class="d-none justify-content-between align-items-center border-top border-secondary mt-3 pt-3">
                        <span>Total simulado</span>
                        <strong id="checkoutSummaryTotal" class="font-anton text-primary fs-4">S/ 0.00</strong>
                    </div>
                    <div id="checkoutActions" class="mt-3" hidden>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-process-gateway" data-gateway-scenario="PAGADO">Confirmar pago</button>
                            <button type="button" class="btn btn-outline btn-process-gateway" data-gateway-scenario="EN_PROCESO">Dejar pendiente</button>
                            <button type="button" class="btn btn-outline btn-process-gateway" data-gateway-scenario="RECHAZADO">Marcar como rechazado</button>
                            <button type="button" class="btn btn-outline btn-process-gateway" data-gateway-scenario="CANCELADO">Cancelar operación</button>
                        </div>
                        <p class="text-muted text-xs mt-2 mb-0">No genera cargos.</p>
                        <p id="checkoutError" class="text-danger mt-3 mb-0" role="alert"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>

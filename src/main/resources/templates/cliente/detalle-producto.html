<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Detalle del producto - Energy Gym</title></head>
<body>
<section class="client-wrapper">
    <div th:replace="~{fragments/cliente-sidebar :: sidebar('productos')}"></div>
    <div class="client-main">
        <div th:replace="~{fragments/cliente-topbar :: topbar}"></div>
        <div class="client-content">
            <nav aria-label="Ruta de navegación" class="mb-4">
                <ol class="breadcrumb font-anton text-sm">
                    <li class="breadcrumb-item"><a th:href="@{/cliente/productos}">Productos</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${producto.nombre}"></li>
                </ol>
            </nav>
            <div th:replace="~{fragments/producto-detalle :: contenido}"></div>
        </div>
    </div>
</section>
</body>
</html>

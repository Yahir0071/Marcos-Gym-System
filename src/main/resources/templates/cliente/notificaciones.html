<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Notificaciones - Energy Gym</title></head>
<body>
<section class="client-wrapper">
    <div th:replace="~{fragments/cliente-sidebar :: sidebar('notificaciones')}"></div>
    <div class="client-main">
        <div th:replace="~{fragments/cliente-topbar :: topbar}"></div>
        <div class="client-content" id="notificaciones"
             th:attr="data-leer=@{/cliente/api/notificaciones/leer},data-archivar=@{/cliente/api/notificaciones/archivar}">
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="display-3 font-anton leading-none mb-2 text-light">NOTIFICACIONES</h1>
                    <p class="text-muted m-0">Avisos sobre tu membresía, reservas y promociones.</p>
                </div>
                <button type="button" class="btn btn-outline py-2 px-3 text-xs" data-leer-todas
                        th:disabled="${notificaciones.?[!leida].isEmpty()}">
                    <i class="fa-solid fa-check-double text-primary" aria-hidden="true"></i> MARCAR TODAS COMO LEÍDAS
                </button>
            </div>

            <div class="d-flex gap-2 flex-wrap mb-3" id="notifFilterGroup" role="group" aria-label="Filtrar avisos">
                <button type="button" class="btn btn-primary" data-filtro="ALL" aria-pressed="true">Todas <span th:text="${notificaciones.size()}">0</span></button>
                <button type="button" class="btn btn-outline" data-filtro="MEMBRESIA" aria-pressed="false">Membresía <span th:text="${notificaciones.?[categoria == 'MEMBRESIA'].size()}">0</span></button>
                <button type="button" class="btn btn-outline" data-filtro="RESERVAS" aria-pressed="false">Reservas <span th:text="${notificaciones.?[categoria == 'RESERVAS'].size()}">0</span></button>
                <button type="button" class="btn btn-outline" data-filtro="PROMOCIONES" aria-pressed="false">Promociones <span th:text="${notificaciones.?[categoria == 'PROMOCIONES'].size()}">0</span></button>
            </div>

            <p class="small" id="notifMensaje" role="status"></p>
            <div class="d-flex flex-column gap-3">
                <article th:each="aviso : ${notificaciones}" class="card p-3 p-md-4"
                         th:attr="data-categoria=${aviso.categoria},data-clave=${aviso.clave},data-leida=${aviso.leida}">
                    <div class="d-flex align-items-baseline flex-wrap gap-2 mb-2">
                        <h2 class="font-anton m-0 fs-5 text-light" th:text="${aviso.titulo}">Aviso</h2>
                        <span th:unless="${aviso.leida}" class="badge bg-primary text-dark" data-no-leida>No leída</span>
                    </div>
                    <p class="text-muted text-sm mb-3" th:text="${aviso.mensaje}"></p>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:if="${aviso.categoria == 'MEMBRESIA'}" th:href="@{/cliente/mi-membresia}" class="btn btn-outline py-1 px-3 text-xs">Mi membresía</a>
                        <a th:if="${aviso.categoria == 'RESERVAS'}" th:href="@{/cliente/mis-reservas}" class="btn btn-outline py-1 px-3 text-xs">Mis reservas</a>
                        <a th:if="${aviso.categoria == 'PROMOCIONES'}" th:href="@{/promociones}" class="btn btn-outline py-1 px-3 text-xs">Ver promociones</a>
                        <button th:unless="${aviso.leida}" type="button" class="btn btn-outline py-1 px-3 text-xs" data-leer-aviso>Marcar como leída</button>
                        <button type="button" class="btn btn-outline py-1 px-3 text-xs" data-archivar-aviso>Archivar</button>
                    </div>
                </article>
            </div>
            <p id="notifVacio" class="text-center py-5 text-muted" th:hidden="${!notificaciones.isEmpty()}">
                No tienes avisos en esta categoría.
            </p>
        </div>
    </div>
</section>
</body>
</html>

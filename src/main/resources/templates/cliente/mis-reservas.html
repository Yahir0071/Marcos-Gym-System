<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Mis Reservas - Energy Gym</title></head>
<body>
    <section class="client-wrapper">
        <div th:replace="~{fragments/cliente-sidebar :: sidebar('reservas')}"></div>
        <div class="client-main">
            <div th:replace="~{fragments/cliente-topbar :: topbar}"></div>
            <div class="client-content">
                <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
                    <div>
                        <div class="section-subtitle has-line mb-2">TODAS TUS RESERVAS</div>
                        <h1 class="display-3 font-anton leading-none mb-1 text-light">MIS <span class="text-primary">RESERVAS</span></h1>
                        <p class="font-anton text-muted m-0 tracking-wide text-lg">REVISA, SIGUE Y RECOGE TUS PRODUCTOS EN EL LOCAL</p>
                    </div>
                    <a th:href="@{/cliente/productos}" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> NUEVA RESERVA
                    </a>
                </div>
                <!-- Flash Messages -->
                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show bg-dark text-success border border-success mb-4" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${mensajeExito}"></span>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show bg-dark text-danger border border-danger mb-4" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${mensajeError}"></span>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>

                <!-- Filters -->
                <div class="filters-bar">
                    <div class="filter-group filter-large">
                        <label>BUSCAR RESERVA</label>
                        <input type="text" class="table-search-input" placeholder="Buscar por producto o código (#RES-00490)...">
                    </div>
                    <div class="filter-group">
                        <label>FILTRAR POR ESTADO</label>
                        <select class="table-filter-select" data-filter-col="4">
                            <option value="">TODOS LOS ESTADOS</option>
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="CONFIRMADA">CONFIRMADA</option>
                            <option value="ENTREGADA">ENTREGADA</option>
                            <option value="CANCELADA">CANCELADA</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="custom-table filterable-table" id="tablaMisReservas">
                        <thead>
                            <tr>
                                <th>CÓDIGO</th>
                                <th>FECHA</th>
                                <th>PRODUCTO</th>
                                <th>CANT.</th>
                                <th>ESTADO</th>
                                <th>ACCIÓN</th>
                            </tr>
                        </thead>
                        <tbody id="misReservasTbody">
                            <tr th:each="res : ${reservas}">
                                <td class="code-cell" th:text="'#RES-' + ${#numbers.formatInteger(res.id, 5)}">#RES-00001</td>
                                <td class="text-muted text-sm" th:text="${#temporals.format(res.fechaReserva, 'dd MMM yyyy')}">20 Ene 2025</td>
                                <td class="text-light fw-bold" th:text="${res.producto.nombre}">Whey Protein 2 LB</td>
                                <td th:text="${res.cantidad}">1</td>
                                <td>
                                    <span th:class="${res.estado.name() == 'PENDIENTE' ? 'status-warning' : (res.estado.name() == 'ENTREGADA' ? 'status-draft' : (res.estado.name() == 'CANCELADA' ? 'status-inactive' : ''))}"
                                          th:text="${res.estado}">PENDIENTE</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:if="${res.estado.name() == 'PENDIENTE'}"
                                           th:href="@{/cliente/pago-en-linea(reservaId=${res.id})}"
                                           class="btn-table-action btn-primary text-decoration-none">PAGAR</a>
                                        <form th:if="${res.estado.name() == 'PENDIENTE'}"
                                              th:action="@{/cliente/reservas/cancelar}" method="post" class="m-0 p-0"
                                              onsubmit="return confirm('¿Estás seguro de cancelar esta reserva?');">
                                            <input type="hidden" name="reservaId" th:value="${res.id}"/>
                                            <button type="submit" class="btn-table-action text-danger">CANCELAR</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No tienes reservas registradas actualmente. <a th:href="@{/cliente/productos}" class="text-primary fw-bold">¡Explora nuestra tienda!</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

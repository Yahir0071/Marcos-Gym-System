<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Energy Gym</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=12)}" href="../../static/css/style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <!-- Spring Security CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
</head>
<body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <!-- Content injected here -->
    <div id="main-content" th:replace="${content}"></div>

    <!-- Universal Dynamic Modal for Client & Public Interactive Actions -->
    <div class="modal fade" id="dynamicGymModal" tabindex="-1" aria-labelledby="dynamicGymModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content gym-modal">
                <div class="modal-header">
                    <h5 class="modal-title font-anton text-primary tracking-wide" id="dynamicGymModalTitle">ENERGY GYM</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar ventana"></button>
                </div>
                <div class="modal-body" id="dynamicGymModalBody"></div>
            </div>
        </div>
    </div>

    <!-- Accessible Toast Container -->
    <div class="gym-toast-container" id="gymToastContainer" aria-live="polite" aria-atomic="true"></div>

    <!-- Floating Chatbot Widget (Public & Client only) -->
    <div th:replace="~{fragments/chatbot-widget :: widget}"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <!-- Custom JS (ES6 Modules) -->
    <script type="module" th:src="@{/js/main.js(v=9)}" src="../../static/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Energy Gym</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=6)}" href="../../static/css/style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Spring Security CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
</head>
<body>

    <!-- Content injected here -->
    <div th:replace="${content}"></div>

    <!-- Universal Dynamic Modal for Client & Public Interactive Actions -->
    <div class="modal fade" id="dynamicGymModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content gym-modal">
                <div class="modal-header">
                    <h5 class="modal-title font-anton text-primary tracking-wide" id="dynamicGymModalTitle">ENERGY GYM</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="dynamicGymModalBody"></div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="gym-toast-container" id="gymToastContainer"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS (ES6 Modules) -->
    <script type="module" th:src="@{/js/main.js(v=6)}" src="../../static/js/main.js"></script>
</body>
</html>

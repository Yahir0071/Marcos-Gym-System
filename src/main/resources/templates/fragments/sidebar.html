<aside th:fragment="sidebar" class="admin-sidebar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" aria-label="Menú lateral">
    <div class="p-4 border-bottom border-secondary">
        <a sec:authorize="hasAnyRole('ADMINISTRACION', 'ADMINISTRADOR')" class="text-light text-decoration-none d-flex align-items-center gap-2" th:href="@{/admin/dashboard}">
            <span class="text-primary fs-4" aria-hidden="true">⚡</span>
            <div>
                <div class="font-anton text-lg tracking-wide leading-none">ENERGY GYM</div>
                <small class="text-primary text-2xs fw-bold tracking-wider">ADMINISTRACIÓN</small>
            </div>
        </a>
        <a sec:authorize="hasRole('RECEPCION')" class="text-light text-decoration-none d-flex align-items-center gap-2" th:href="@{/admin/socios}">
            <span class="text-primary fs-4" aria-hidden="true">⚡</span>
            <div>
                <div class="font-anton text-lg tracking-wide leading-none">ENERGY GYM</div>
                <small class="text-primary text-2xs fw-bold tracking-wider">RECEPCIÓN</small>
            </div>
        </a>
        <a sec:authorize="hasRole('GESTOR_TECNICO')" class="text-light text-decoration-none d-flex align-items-center gap-2" th:href="@{/tecnico/cuentas}">
            <span class="text-primary fs-4" aria-hidden="true">⚡</span>
            <div>
                <div class="font-anton text-lg tracking-wide leading-none">ENERGY GYM</div>
                <small class="text-primary text-2xs fw-bold tracking-wider">GESTOR TÉCNICO</small>
            </div>
        </a>
    </div>
    <nav sec:authorize="hasRole('GESTOR_TECNICO')" class="flex-grow-1 d-flex flex-column gap-1 px-3 py-3" aria-label="Menú técnico">
        <a class="sidebar-link" th:href="@{/tecnico/cuentas}"><i class="fa-solid fa-users-gear" aria-hidden="true"></i> Cuentas y Roles</a>
    </nav>
    <nav sec:authorize="hasAnyRole('ADMINISTRACION', 'RECEPCION', 'ADMINISTRADOR')" class="flex-grow-1 d-flex flex-column gap-1 px-3 py-3" aria-label="Menú operativo">
        <a sec:authorize="hasAnyRole('ADMINISTRACION', 'ADMINISTRADOR')" class="sidebar-link" th:href="@{/admin/dashboard}"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i> Dashboard</a>
        <a class="sidebar-link" th:href="@{/admin/socios}"><i class="fa-solid fa-users" aria-hidden="true"></i> Socios</a>
        <a class="sidebar-link" th:href="@{/admin/planes}"><i class="fa-solid fa-tags" aria-hidden="true"></i> Planes</a>
        <a class="sidebar-link" th:href="@{/admin/membresias}"><i class="fa-solid fa-id-card" aria-hidden="true"></i> Membresías</a>
        <a class="sidebar-link" th:href="@{/admin/pagos}"><i class="fa-solid fa-money-bill" aria-hidden="true"></i> Pagos</a>
        <a class="sidebar-link" th:href="@{/admin/promociones}"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Promociones</a>
        <a class="sidebar-link" th:href="@{/admin/productos}"><i class="fa-solid fa-box-open" aria-hidden="true"></i> Productos</a>
        <a class="sidebar-link" th:href="@{/admin/reservas}"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i> Reservas</a>
        <a class="sidebar-link" th:href="@{/admin/afluencia}"><i class="fa-solid fa-people-group" aria-hidden="true"></i> Afluencia</a>
        <a sec:authorize="hasAnyRole('ADMINISTRACION', 'ADMINISTRADOR')" class="sidebar-link" th:href="@{/admin/equipos}"><i class="fa-solid fa-dumbbell" aria-hidden="true"></i> Equipos</a>
        <a sec:authorize="hasAnyRole('ADMINISTRACION', 'ADMINISTRADOR')" class="sidebar-link" th:href="@{/admin/mantenimientos}"><i class="fa-solid fa-wrench" aria-hidden="true"></i> Mantenimiento</a>
    </nav>
</aside>

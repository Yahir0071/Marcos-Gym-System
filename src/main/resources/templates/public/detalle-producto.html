<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Detalle del Producto - Energy Gym</title></head>
<body>
    <section>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container-fluid px-4 px-lg-5 page-container">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb font-anton text-sm tracking-wide">
                    <li class="breadcrumb-item"><a th:href="@{/productos}" class="text-decoration-none text-muted">PRODUCTOS</a></li>
                    <li class="breadcrumb-item active text-primary" aria-current="page" th:text="${producto != null ? producto.nombre.toUpperCase() : 'DETALLE DE PRODUCTO'}">WHEY PROTEIN 2 LB</li>
                </ol>
            </nav>

            <div class="grid-2-col">
                <div class="card product-detail-box border-secondary p-4 bg-deep-dark d-flex align-items-center justify-content-center">
                    <img th:if="${producto != null and producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}" 
                         th:src="@{${producto.imagenUrl}}" th:alt="${producto.nombre}" class="img-fluid h-100 obj-contain">
                    <div th:if="${producto == null or producto.imagenUrl == null or #strings.isEmpty(producto.imagenUrl)}" 
                         class="d-flex flex-column align-items-center justify-content-center text-center p-4">
                        <i class="fa-solid fa-jar text-primary" style="font-size: 5rem;"></i>
                        <span class="font-anton text-muted text-sm mt-3" th:text="${producto != null ? producto.nombre : 'IMAGEN DEL PRODUCTO'}">PRODUCTO</span>
                    </div>
                </div>
                <div class="d-flex flex-column justify-content-center">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <span class="text-primary font-anton text-sm" 
                              th:text="${producto != null and (producto.nombre.toUpperCase().contains('SHAKER') or producto.nombre.toUpperCase().contains('BOTELLA')) ? 'BOTELLAS' : (producto != null and (producto.nombre.toUpperCase().contains('CORREA') or producto.nombre.toUpperCase().contains('GUANTE')) ? 'ACCESORIOS' : (producto != null and producto.nombre.toUpperCase().contains('CAMISETA') ? 'ROPA' : 'SUPLEMENTOS'))}">SUPLEMENTOS</span>
                        <span th:if="${producto != null and producto.stock > 0}" class="badge text-success border border-success bg-transparent tracking-wide text-2xs" th:text="'STOCK: ' + ${producto.stock} + ' UNIDADES'">STOCK DISPONIBLE</span>
                        <span th:if="${producto != null and producto.stock <= 0}" class="badge text-danger border border-danger bg-transparent tracking-wide text-2xs">AGOTADO</span>
                    </div>
                    <h1 class="display-4 font-anton text-light mb-3 leading-none" th:text="${producto != null ? producto.nombre.toUpperCase() : 'PRODUCTO'}">WHEY PROTEIN 2 LB</h1>
                    <h2 class="font-anton text-primary mb-4" th:text="${producto != null ? 'S/ ' + #numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'POINT') : 'S/ --'}">S/ 149</h2>
                    <p class="text-muted text-sm mb-4" th:text="${producto != null ? producto.descripcion : 'Sin descripción disponible.'}">Proteína aislada de suero de leche de alta pureza...</p>
                    <div class="d-flex gap-3 flex-wrap">
                        <button type="button" class="btn btn-primary px-4 py-3 btn-quick-reserve" 
                                th:attr="data-product=${producto != null ? producto.nombre : ''}, data-price=${producto != null ? producto.precio : 0}, data-id=${producto != null ? producto.id : 1}">
                            <i class="fa-solid fa-bag-shopping"></i> RESERVAR PARA RECOJO EN TIENDA
                        </button>
                        <a th:href="@{/productos}" class="btn btn-outline px-4 py-3">VOLVER AL CATÁLOGO</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Catálogo - Energy Gym</title>
</head>
<body>
    <section>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        
        <div class="container" style="margin-top: 100px; min-height: 80vh;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold" style="color: var(--primary-color);">CATÁLOGO DE SUPLEMENTOS</h2>
                <div class="d-flex gap-2">
                    <select class="form-select bg-dark text-light border-secondary">
                        <option>Todas las categorías</option>
                        <option>Proteínas</option>
                        <option>Pre-entrenos</option>
                        <option>Accesorios</option>
                    </select>
                </div>
            </div>

            <div class="row g-4">
                <!-- Producto 1 -->
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-img-top bg-secondary text-center py-5">
                            <i class="fa-solid fa-jar text-light fs-1"></i>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Whey Protein 100%</h5>
                            <p class="text-muted small">Proteína aislada de suero de leche, 2kg.</p>
                            <h4 class="text-primary mt-auto">$55.00</h4>
                            <a th:href="@{/detalle-producto}" class="btn btn-sm btn-outline-light mt-3">Ver Detalle</a>
                        </div>
                    </div>
                </div>
                <!-- Producto 2 -->
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-img-top bg-secondary text-center py-5">
                            <i class="fa-solid fa-bottle-water text-light fs-1"></i>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">BCAA Energy</h5>
                            <p class="text-muted small">Aminoácidos con cafeína, 30 servicios.</p>
                            <h4 class="text-primary mt-auto">$25.00</h4>
                            <a th:href="@{/detalle-producto}" class="btn btn-sm btn-outline-light mt-3">Ver Detalle</a>
                        </div>
                    </div>
                </div>
                <!-- Agrega más productos simulados aquí -->
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{fragments/base :: layout(~{::title}, ~{::section})}">
<head><title>Productos - Energy Gym</title></head>
<body>
    <section>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container-fluid px-5 page-container">
            <div class="section-subtitle has-line mb-3">NUTRE TU ESFUERZO</div>
            <h1 class="display-3 font-anton leading-none mb-1 text-light">PRODUCTOS<br><span class="text-primary">SUPLEMENTOS Y MÁS</span></h1>
            <p class="font-anton text-muted mb-4 tracking-wide text-lg">CALIDAD PARA TU MEJOR VERSIÓN</p>
            <label class="form-label mt-3">BUSCAR PRODUCTOS</label>
            <input type="text" class="form-control mb-4" placeholder="Buscar productos, marcas o categorías...">
            <div class="d-flex gap-2 flex-wrap mb-5">
                <button class="btn btn-primary px-4">TODOS</button>
                <button class="btn btn-outline px-4">SUPLEMENTOS</button>
                <button class="btn btn-outline px-4">ACCESORIOS</button>
                <button class="btn btn-outline px-4">ROPA</button>
                <button class="btn btn-outline px-4">BOTELLAS</button>
                <button class="btn btn-outline px-4">OTROS</button>
            </div>
            <div class="grid-products mb-5">
                <div class="card d-flex flex-column border-secondary overflow-hidden">
                    <img th:src="@{/img/whey.jpg}" alt="Whey Protein" class="card-img-top h-250px obj-contain bg-deep-dark">
                    <div class="p-4 d-flex flex-column flex-grow-1">
                        <span class="badge text-success mb-3 align-self-start border border-success bg-transparent tracking-wide text-xs">DISPONIBLE</span>
                        <h6 class="font-anton mb-1 text-light">WHEY PROTEIN 2 LB</h6>
                        <h4 class="font-anton text-primary mb-4">S/ 149</h4>
                        <a th:href="@{/detalle-producto}" class="btn btn-outline w-100 text-start mt-auto">VER DETALLE</a>
                    </div>
                </div>
                <div class="card d-flex flex-column border-secondary overflow-hidden">
                    <img th:src="@{/img/creatina.jpg}" alt="Creatina" class="card-img-top h-250px obj-contain bg-deep-dark">
                    <div class="p-4 d-flex flex-column flex-grow-1">
                        <span class="badge text-success mb-3 align-self-start border border-success bg-transparent tracking-wide text-xs">DISPONIBLE</span>
                        <h6 class="font-anton mb-1 text-light">CREATINA 300 G</h6>
                        <h4 class="font-anton text-primary mb-4">S/ 89</h4>
                        <a th:href="@{/detalle-producto}" class="btn btn-outline w-100 text-start mt-auto">VER DETALLE</a>
                    </div>
                </div>
                <div class="card d-flex flex-column border-secondary overflow-hidden">
                    <img th:src="@{/img/shaker.jpg}" alt="Shaker" class="card-img-top h-250px obj-contain bg-deep-dark">
                    <div class="p-4 d-flex flex-column flex-grow-1">
                        <span class="badge text-success mb-3 align-self-start border border-success bg-transparent tracking-wide text-xs">DISPONIBLE</span>
                        <h6 class="font-anton mb-1 text-light">SHAKER 700 ML</h6>
                        <h4 class="font-anton text-primary mb-4">S/ 39</h4>
                        <a th:href="@{/detalle-producto}" class="btn btn-outline w-100 text-start mt-auto">VER DETALLE</a>
                    </div>
                </div>
                <div class="card d-flex flex-column border-secondary">
                    <div class="product-image-box h-250px">
                        <h4 class="font-anton text-muted m-0">PRÓXIMAMENTE</h4>
                    </div>
                    <div class="p-4 d-flex flex-column flex-grow-1">
                        <span class="badge text-muted mb-3 align-self-start border border-secondary bg-transparent tracking-wide text-xs">AGOTADO</span>
                        <h6 class="font-anton mb-1 text-light">CORREAS DE LEVANTE</h6>
                        <h4 class="font-anton text-muted mb-4">S/ 59</h4>
                        <button class="btn btn-outline w-100 text-start mt-auto" disabled>AGOTADO</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
